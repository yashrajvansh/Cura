[workspace]
resolver = "2"
members = [
  "crates/cura-protocol",
  "crates/cura-crypto",
  "crates/cura-registry",
  "crates/cura-worker",
  "crates/ya-ra",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
authors = ["Comfort Curators Private Limited"]
repository = "https://github.com/yashrajvansh/Cura"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1.10", features = ["v7", "serde"] }
anyhow = "1.0"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
